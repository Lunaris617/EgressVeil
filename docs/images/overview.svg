<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
<title id="title">EgressVeil 功能总览</title><desc id="desc">统一管理严格 HTTP UA、规则分流和 IPv4 TTL；统计为隔离验证结果。</desc>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style>
<rect x="0" y="0" width="1280" height="650" rx="0" fill="#f3f6fc" stroke="none"/><rect x="0" y="0" width="1280" height="145" rx="0" fill="#12233f" stroke="none"/><text x="46" y="62" font-size="40" fill="#ffffff" font-weight="700">EgressVeil</text><text x="48" y="108" font-size="23" fill="#bfd3f5" font-weight="400">一个固件包  ·  一个 LuCI 入口  ·  三项出口策略</text><rect x="1024" y="38" width="206" height="47" rx="18" fill="#263c5c" stroke="none"/><text x="1044" y="69" font-size="22" fill="#ffffff" font-weight="600">GPLv3  /  dev</text><rect x="44" y="174" width="376" height="276" rx="18" fill="#ffffff" stroke="#dbe4f1"/><rect x="66" y="196" width="50" height="38" rx="9" fill="#1f65c9" stroke="none"/><text x="76" y="223" font-size="20" fill="#fff" font-weight="700">01</text><text x="66" y="272" font-size="28" fill="#12233f" font-weight="700">严格 HTTP UA</text><text x="66" y="305" font-size="17" fill="#1f65c9" font-weight="600">UA3F · 精简核心</text><text x="66" y="349" font-size="18" fill="#40516b" font-weight="400">HTTP/1 与明文 HTTP/2/h2c</text><text x="66" y="381" font-size="18" fill="#40516b" font-weight="400">默认 UA = FFF，可自定义</text><text x="66" y="413" font-size="18" fill="#40516b" font-weight="400">TLS 透明传输，不解密</text><rect x="452" y="174" width="376" height="276" rx="18" fill="#ffffff" stroke="#dbe4f1"/><rect x="474" y="196" width="50" height="38" rx="9" fill="#087e79" stroke="none"/><text x="484" y="223" font-size="20" fill="#fff" font-weight="700">02</text><text x="474" y="272" font-size="28" fill="#12233f" font-weight="700">规则分流</text><text x="474" y="305" font-size="17" fill="#087e79" font-weight="600">OpenClash + Mihomo</text><text x="474" y="349" font-size="18" fill="#40516b" font-weight="400">国内直连与默认规则例外</text><text x="474" y="381" font-size="18" fill="#40516b" font-weight="400">自动选择 / 手动指定节点</text><text x="474" y="413" font-size="18" fill="#40516b" font-weight="400">UDP、QUIC 按规则处理*</text><rect x="860" y="174" width="376" height="276" rx="18" fill="#ffffff" stroke="#dbe4f1"/><rect x="882" y="196" width="50" height="38" rx="9" fill="#7553b7" stroke="none"/><text x="892" y="223" font-size="20" fill="#fff" font-weight="700">03</text><text x="882" y="272" font-size="28" fill="#12233f" font-weight="700">IPv4 出口</text><text x="882" y="305" font-size="17" fill="#7553b7" font-weight="600">TTL64 + GRO 保护</text><text x="882" y="349" font-size="18" fill="#40516b" font-weight="400">WAN 出站 IPv4 TTL = 64</text><text x="882" y="381" font-size="18" fill="#40516b" font-weight="400">桥接 / GRO / 就绪状态审计</text><text x="882" y="413" font-size="18" fill="#40516b" font-weight="400">异常保留保护并监督恢复</text><rect x="44" y="476" width="292" height="90" rx="18" fill="#e5edf9" stroke="none"/><text x="62" y="516" font-size="29" fill="#1f65c9" font-weight="700">25</text><text x="62" y="546" font-size="17" fill="#40516b" font-weight="400">协议测试</text><rect x="350" y="476" width="292" height="90" rx="18" fill="#e5edf9" stroke="none"/><text x="368" y="516" font-size="29" fill="#1f65c9" font-weight="700">40</text><text x="368" y="546" font-size="17" fill="#40516b" font-weight="400">并发 socket mark</text><rect x="656" y="476" width="292" height="90" rx="18" fill="#e5edf9" stroke="none"/><text x="674" y="516" font-size="29" fill="#1f65c9" font-weight="700">70</text><text x="674" y="546" font-size="17" fill="#40516b" font-weight="400">TTL64 出站样本</text><rect x="962" y="476" width="292" height="90" rx="18" fill="#e5edf9" stroke="none"/><text x="980" y="516" font-size="29" fill="#1f65c9" font-weight="700">通过</text><text x="980" y="546" font-size="17" fill="#40516b" font-weight="400">隔离重启恢复</text><text x="46" y="602" font-size="19" fill="#40516b" font-weight="600">OpenWrt 25.12 · x86/64 · 单 LAN 物理口 + 独立 WAN · dev 试验版</text><text x="46" y="632" font-size="16" fill="#65748a" font-weight="400">* 代理节点须支持 UDP。图示与统计不代表任意硬件已通过验收。</text></svg>