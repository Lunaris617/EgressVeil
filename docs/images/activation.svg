<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">EgressVeil 启用流程</title><desc id="desc">编译包、准备网络、填写订阅、核对实际状态。</desc>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style>
<rect x="0" y="0" width="1280" height="420" rx="0" fill="#f3f6fc" stroke="none"/><text x="42" y="51" font-size="30" fill="#12233f" font-weight="700">从编译到启用</text><text x="44" y="85" font-size="20" fill="#536680" font-weight="400">基础网络和认证正常后，填写订阅进入统一工作流程。</text><rect x="42" y="119" width="276" height="208" rx="18" fill="#fff" stroke="#dbe4f1"/><rect x="60" y="137" width="42" height="36" rx="9" fill="#1f65c9" stroke="none"/><text x="74" y="162" font-size="20" fill="#fff" font-weight="700">1</text><text x="60" y="211" font-size="25" fill="#12233f" font-weight="700">编译固件</text><text x="60" y="254" font-size="18" fill="#40516b" font-weight="400">选中 &lt;*&gt; 集成包</text><text x="60" y="285" font-size="18" fill="#40516b" font-weight="400">系统依赖一同编译</text><path d="M 326 218 h 12 m -6 -6 l 6 6 -6 6" stroke="#8099bb" stroke-width="3" fill="none"/><rect x="349" y="119" width="276" height="208" rx="18" fill="#fff" stroke="#dbe4f1"/><rect x="367" y="137" width="42" height="36" rx="9" fill="#1f65c9" stroke="none"/><text x="381" y="162" font-size="20" fill="#fff" font-weight="700">2</text><text x="367" y="211" font-size="25" fill="#12233f" font-weight="700">准备网络</text><text x="367" y="254" font-size="18" fill="#40516b" font-weight="400">配置 LAN / WAN</text><text x="367" y="285" font-size="18" fill="#40516b" font-weight="400">完成所需校园网认证</text><path d="M 633 218 h 12 m -6 -6 l 6 6 -6 6" stroke="#8099bb" stroke-width="3" fill="none"/><rect x="656" y="119" width="276" height="208" rx="18" fill="#fff" stroke="#dbe4f1"/><rect x="674" y="137" width="42" height="36" rx="9" fill="#1f65c9" stroke="none"/><text x="688" y="162" font-size="20" fill="#fff" font-weight="700">3</text><text x="674" y="211" font-size="25" fill="#12233f" font-weight="700">填写订阅</text><text x="674" y="254" font-size="18" fill="#40516b" font-weight="400">服务 → EgressVeil</text><text x="674" y="285" font-size="18" fill="#40516b" font-weight="400">启用 · 保存并应用</text><path d="M 940 218 h 12 m -6 -6 l 6 6 -6 6" stroke="#8099bb" stroke-width="3" fill="none"/><rect x="963" y="119" width="276" height="208" rx="18" fill="#fff" stroke="#dbe4f1"/><rect x="981" y="137" width="42" height="36" rx="9" fill="#1f65c9" stroke="none"/><text x="995" y="162" font-size="20" fill="#fff" font-weight="700">4</text><text x="981" y="211" font-size="25" fill="#12233f" font-weight="700">核对状态</text><text x="981" y="254" font-size="18" fill="#40516b" font-weight="400">READY + 实际进程</text><text x="981" y="285" font-size="18" fill="#40516b" font-weight="400">TTL 规则 + 连接测试</text><rect x="42" y="350" width="1196" height="45" rx="18" fill="#fff2d7" stroke="none"/><text x="60" y="379" font-size="18" fill="#805b1d" font-weight="400">首次不带订阅与凭据；无订阅不接管。新固件刷入真实硬件后，仍需做一次短验收。</text></svg>